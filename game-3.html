<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jeu 3 - JDPM</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Préchargement des assets critiques -->
  <link rel="preload" href="css/_variables.css" as="style">
  <link rel="preload" href="css/base.css" as="style">
  <link rel="preload" href="css/game-base.css" as="style">
  <link rel="preload" href="css/game-3.css" as="style">
  <link rel="preload" href="js/state.js" as="script">
  <link rel="preload" href="js/utils.js" as="script">
  <link rel="preload" href="js/translations.js" as="script">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/_variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game-base.css">
  <link rel="stylesheet" href="css/game-3.css">
  
  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Message hors ligne -->
  <div id="offline-message" style="display: none; position: fixed; top: 0; left: 0; right: 0; background: #E83C6E; color: white; padding: 10px; text-align: center; z-index: 1000;">
    ⚠️ Mode hors ligne activé
  </div>

  <div class="container">
    <div class="game-container">
      <header class="game-header">
        <a href="hub.html" class="back-btn" id="backBtn">← HUB</a>
        <h1 class="game-title" id="gameTitle">Jeu 3 - Recherche d'Image</h1>
        <button class="info-btn" id="infoBtn">ⓘ</button>
      </header>
      <main>
        <p id="gameInstructions">Contenu du jeu en construction...</p>
      </main>
      <footer class="game-footer">
        <!-- Boutons/inputs à ajouter -->
      </footer>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/i18n-utils.js"></script>
  
  <!-- Scripts spécifiques à la page -->
  <script>
    // Mettre à jour les traductions de la page
    async function updatePageTranslations() {
      await initializeLanguage();
      
      // Mettre à jour les textes
      document.getElementById('backBtn').textContent = translate('buttons.backToHub');
      document.getElementById('gameTitle').textContent = translate('games.game3.title');
      document.getElementById('gameInstructions').textContent = translate('games.game3.instructions');
      
      // Mettre à jour le message hors ligne
      const offlineMessage = document.getElementById('offline-message');
      if (offlineMessage) {
        offlineMessage.textContent = `⚠️ ${translate('misc.offline')}`;
      }
    }

    // Écouter les changements de langue
    window.addEventListener('languageChanged', updatePageTranslations);
    
    // Initialiser au chargement
    document.addEventListener('DOMContentLoaded', updatePageTranslations);
  </script>
  
  <!-- Enregistrement du Service Worker et détection hors ligne -->
  <script>
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/js/service-worker.js')
          .then((registration) => {
            console.log('✅ Service Worker enregistré avec succès:', registration.scope);
          })
          .catch((error) => {
            console.error('❌ Erreur lors de l\'enregistrement du Service Worker:', error);
          });
      });
    }

    // Détection du mode hors ligne
    function checkOnlineStatus() {
      const isOnline = navigator.onLine;
      const offlineMessage = document.getElementById('offline-message');
      
      if (!isOnline && offlineMessage) {
        offlineMessage.style.display = 'block';
      } else if (offlineMessage) {
        offlineMessage.style.display = 'none';
      }
    }
    
    // Écouter les changements de statut
    window.addEventListener('online', checkOnlineStatus);
    window.addEventListener('offline', checkOnlineStatus);
    
    // Vérifier au chargement
    document.addEventListener('DOMContentLoaded', checkOnlineStatus);
  </script>
</body>
</html>
