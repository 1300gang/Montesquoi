<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jeu 3 - JDPM</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Préchargement des assets critiques -->
  <link rel="preload" href="css/_variables.css" as="style">
  <link rel="preload" href="css/base.css" as="style">
  <link rel="preload" href="css/game-base.css" as="style">
  <link rel="preload" href="css/game-3.css" as="style">
  <link rel="preload" href="js/state.js" as="script">
  <link rel="preload" href="js/utils.js" as="script">
  <link rel="preload" href="js/translations.js" as="script">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/_variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game-base.css">
  <link rel="stylesheet" href="css/game-3.css">
  
  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Style pour l'indicateur de page -->
  <style>
    .page-indicator {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 77, 150, 0.1);
      color: var(--blue);
      font-family: var(--font-body);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      z-index: 10;
      opacity: 0.7;
    }
    @media (max-width: 480px) {
      .page-indicator {
        bottom: 70px;
        font-size: 10px;
        padding: 3px 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Message hors ligne -->
  <div id="offline-message" style="display: none; position: fixed; top: 0; left: 0; right: 0; background: #E83C6E; color: white; padding: 10px; text-align: center; z-index: 1000;">
    ⚠️ <span id="offlineText">Mode hors ligne activé</span>
  </div>

  <!-- Indication discrète de la page actuelle -->
  <div class="page-indicator" id="pageIndicator">Page: Jeu 3</div>

  <div class="container">
    <div class="game-container">
      <header class="game-header">
        <a href="hub.html" class="back-btn" id="backBtn">← HUB</a>
        <h1 class="game-title" id="gameTitle">Jeu 3 - Recherche d'image</h1>
        <button class="info-btn" id="infoBtn">ⓘ</button>
      </header>

      <main>
        <section class="image-section">
          <!-- Image du meuble (placeholder pour l'instant, ou on utilise l'image existante) -->
          <img
            src="image/qcm/qcm-1.svg"
            alt="Meuble à identifier"
            class="furniture-image"
            id="furnitureImage"
          >
        </section>

        <h2 class="question" id="gameQuestion">Quel est le nom de ce meuble ?</h2>

        <section class="answer-section">
          <input
            type="text"
            id="answer-input"
            class="answer-input"
            placeholder="Saisissez le nom du meuble"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="words"
            spellcheck="false"
            enterkeyhint="done"
          >
          <button id="validate-btn" class="validate-btn">Valider</button>
          <p id="feedback" class="feedback"></p>
        </section>
      </main>

      <footer class="game-footer">
        <!-- Vide pour ce jeu -->
      </footer>
    </div>
  </div>

  <!-- Écran de victoire -->
  <div id="win-screen">
    <div class="win-icon">🎉</div>
    <h2 class="win-title" id="winTitle">Félicitations !</h2>
    <p class="win-sub" id="winSub">Bravo ! C'est la bonne réponse.</p>
    <a href="hub.html?win=3" id="btn-hub">Retour au HUB</a>
  </div>

  <!-- Modal Info -->
  <div id="info-modal">
    <div class="modal-box">
      <button class="modal-close" id="infoModalClose" aria-label="Fermer">✕</button>
      <div class="modal-emoji">🖼️</div>
      <h2 class="modal-title" id="infoModalTitle">Jeu 3 - Recherche d'image</h2>
      <p class="modal-text" id="infoModalInstructions">
        Observez attentivement l'image du meuble et saisissez son nom pour valider ce jeu.
      </p>
      <button class="modal-cta" id="infoModalCta">OK</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/i18n-utils.js"></script>
  
  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const CORRECT_ANSWER = 'Chaise'; // Réponse correcte
    let gameWon = false;

    // ==========================================
    // INITIALISATION
    // ==========================================
    async function updatePageTranslations() {
      await initializeLanguage();
      
      // Mettre à jour les textes
      document.getElementById('backBtn').textContent = translate('buttons.backToHub');
      document.getElementById('gameTitle').textContent = translate('games.game3.title');
      document.getElementById('gameQuestion').textContent = translate('games.game3.question');
      document.getElementById('answer-input').placeholder = translate('games.game3.placeholder');
      document.getElementById('validate-btn').textContent = translate('buttons.validate');
      document.getElementById('winTitle').textContent = translate('modals.success.title');
      document.getElementById('winSub').textContent = translate('games.game3.correct');
      document.getElementById('btn-hub').textContent = translate('buttons.backToHub');
      document.getElementById('infoModalTitle').textContent = translate('games.game3.title');
      document.getElementById('infoModalInstructions').textContent = translate('games.game3.instructions');
      document.getElementById('infoModalCta').textContent = translate('modals.welcome.cta');
      document.getElementById('offlineText').textContent = translate('misc.offline');
      document.getElementById('pageIndicator').textContent = `Page: ${translate('games.game3.title').split(' - ')[0] || 'Jeu 3'}`;
    }

    // Écouter les changements de langue
    window.addEventListener('languageChanged', updatePageTranslations);

    document.addEventListener('DOMContentLoaded', async () => {
      await updatePageTranslations();

      // Enregistrer le Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/js/service-worker.js');
      }
      
      // Détection du mode hors ligne
      function checkOnlineStatus() {
        const isOnline = navigator.onLine;
        const offlineMessage = document.getElementById('offline-message');
        if (!isOnline && offlineMessage) {
          offlineMessage.style.display = 'block';
        } else if (offlineMessage) {
          offlineMessage.style.display = 'none';
        }
      }
      window.addEventListener('online', checkOnlineStatus);
      window.addEventListener('offline', checkOnlineStatus);
      checkOnlineStatus();

      // Vérifier si le jeu est déjà terminé
      const state = loadJdpmState();
      if (state.game_3_done) {
        gameWon = true;
        showWinScreen();
      }
    });

    // ==========================================
    // VALIDATION
    // ==========================================
    const answerInput = document.getElementById('answer-input');
    const validateBtn = document.getElementById('validate-btn');
    const feedback = document.getElementById('feedback');

    // Normaliser la réponse (insensible à la casse et aux accents)
    function normalizeAnswer(answer) {
      return answer
        .trim()
        .toUpperCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function validateAnswer() {
      const userAnswer = normalizeAnswer(answerInput.value);
      const correctAnswer = normalizeAnswer(CORRECT_ANSWER);

      if (!userAnswer) {
        showFeedback(translate('modals.error.text'), true);
        triggerShake();
        return;
      }

      if (userAnswer === correctAnswer) {
        onSuccess();
      } else {
        showFeedback(translate('games.game3.incorrect'), true);
        triggerShake();
      }
    }

    function showFeedback(msg, isError) {
      feedback.textContent = msg;
      feedback.className = 'feedback show ' + (isError ? 'error' : 'success');

      // Réinitialiser le feedback après 3 secondes
      setTimeout(() => {
        feedback.className = 'feedback';
      }, 3000);
    }

    function triggerShake() {
      answerInput.classList.remove('error');
      void answerInput.offsetWidth; // Force le reflow
      answerInput.classList.add('error');
      setTimeout(() => {
        answerInput.classList.remove('error');
      }, 400);
    }

    // ==========================================
    // VICTOIRE
    // ==========================================
    function onSuccess() {
      if (gameWon) return;
      gameWon = true;
      markJdpmGameDone(3);
      showWinScreen();
    }

    function showWinScreen() {
      document.getElementById('win-screen').classList.add('show');
    }

    // ==========================================
    // ÉVÉNEMENTS
    // ==========================================
    validateBtn.addEventListener('click', validateAnswer);
    
    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        validateAnswer();
      }
    });

    // ==========================================
    // MODAL INFO
    // ==========================================
    const infoModal = document.getElementById('info-modal');
    function openInfoModal() { infoModal.classList.add('open'); }
    function closeInfoModal() { infoModal.classList.remove('open'); }

    document.getElementById('infoBtn').addEventListener('click', openInfoModal);
    document.getElementById('infoModalClose').addEventListener('click', closeInfoModal);
    document.getElementById('infoModalCta').addEventListener('click', closeInfoModal);
    infoModal.addEventListener('click', e => { if (e.target === infoModal) closeInfoModal(); });
  </script>
</body>
</html>
