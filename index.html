<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Super 1300 — La Chasse aux Énigmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --pink:#F6BACC;
    --teal:#239DAB;
    --cyan:#37B7C0;
    --blue:#0D4D96;
    --orange:#F49B2E;
    --yellow:#FDD211;
    --cream:#EFDAD2;
    --magenta:#E83C6E;
    --font-display:'Baloo 2', sans-serif;
    --font-body:'Nunito', sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    font-family:var(--font-body);
    color:var(--blue);
    -webkit-tap-highlight-color:transparent;
    height: 100%;
    overflow: hidden;
  }

  body{
    background-image:
      radial-gradient(rgba(13,77,150,0.05) 1px, transparent 1px),
      radial-gradient(rgba(13,77,150,0.04) 1px, transparent 1px);
    background-size:24px 24px, 17px 17px;
    background-position:0 0, 8px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .intro-card {
    background: var(--white);
    max-width: 400px;
    width: 90%;
    border-radius: 24px;
    padding: 35px 28px;
    box-shadow: 0 16px 36px rgba(13,77,150,.18);
    text-align: center;
    position: relative;
    border: 4px solid var(--pink);
    transform: rotate(-1deg);
    animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  @keyframes bounceIn {
    from { opacity: 0; transform: scale(0.8) rotate(3deg) translateY(50px); }
    to { opacity: 1; transform: scale(1) rotate(-1deg) translateY(0); }
  }

  .logo-emoji {
    font-size: 64px;
    margin-bottom: 12px;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-8px) rotate(4deg); }
  }

  .eyebrow{
    display:inline-block;
    font-family:var(--font-body);
    font-weight:800;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--magenta);
    background:var(--cream);
    border:2px solid var(--magenta);
    border-radius:999px;
    padding:4px 14px;
    margin-bottom:14px;
    transform:rotate(2deg);
  }

  .main-title {
    font-family:var(--font-display);
    font-weight:800;
    font-size: clamp(28px, 8vw, 38px);
    line-height: 1.1;
    margin: 0 0 16px 0;
    color: var(--blue);
  }

  .main-title span { color: var(--orange); }

  .description {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(13,77,150,0.8);
    margin-bottom: 28px;
  }

  .btn-start {
    display: inline-block;
    width: 100%;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.05em;
    text-decoration: none;
    color: var(--white);
    background: linear-gradient(135deg, var(--orange), var(--magenta));
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(232,60,110,.35);
    transition: transform 0.15s, box-shadow 0.15s;
    text-shadow: 0 2px 4px rgba(13,77,150,0.25);
  }

  .btn-start:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(232,60,110,.35);
  }

  .footer-hint {
    display: block;
    font-size: 11px;
    color: rgba(13,77,150,0.45);
    margin-top: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="intro-card">
    <div class="logo-emoji">🗺️</div>
    <div>
      <span class="eyebrow">JDPM MADD</span>
    </div>
    <h1 class="main-title">Super <span>1300</span></h1>
    <p class="description">
      Une aventure mystérieuse et interactive t'attend !<br>
      Résous 5 énigmes captivantes pour déverrouiller le grand trésor final. Es-tu prêt à relever le défi ?
    </p>
    <a href="hub.html" class="btn-start">Commencer l'aventure</a>
    <span class="footer-hint">Préférable sur smartphone 📱</span>
  </div>

</body>
</html>
