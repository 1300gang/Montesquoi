<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors Ligne - JDPM</title>
  <link rel="stylesheet" href="css/_variables.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: var(--spacing-lg);
    }
    .offline-icon {
      font-size: 64px;
      margin-bottom: var(--spacing-md);
    }
    h1 {
      color: var(--magenta);
    }
    p {
      max-width: 300px;
      margin-bottom: var(--spacing-md);
    }
    .retry-btn {
      background: var(--teal);
      color: var(--white);
      border: none;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--border-radius-md);
      font-family: var(--font-display);
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="offline-icon">📵</div>
  <h1>Mode Hors Ligne</h1>
  <p>Vous êtes actuellement hors ligne. Le site fonctionne avec les données cachées, mais certaines fonctionnalités peuvent être limitées.</p>
  <button class="retry-btn" onclick="window.location.reload()">Recharger</button>
  <script>
    // Vérifier si on est de retour en ligne
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
